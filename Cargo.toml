[workspace]
members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
getrandom = { version = "0.4", features = ["std"] }
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
zeroize = "1"

[profile.release]
lto = "thin"
strip = true
