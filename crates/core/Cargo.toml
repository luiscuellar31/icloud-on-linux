[package]
name = "icloud-core"
description = "Connection, upload, and sync logic of iCloud on Linux, without a user interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
getrandom.workspace = true
nix.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Reading the local key with echo off, in the real-account check.
nix = { workspace = true, features = ["term"] }
# Read the `tr!` texts from the sources to check the translations.
proc-macro2 = "1"
syn = "3"

# The real-account check parses its own options, so it has its own main function.
[[test]]
name = "icloud_sync"
harness = false
